[package]
name = "quic-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The relay: rooms of clients, every datagram forwarded to the rest of the room, and who may send checked against quic-auth grants."

[dependencies]
quic-link = { workspace = true }
quic-proto = { workspace = true }
quic-auth = { workspace = true }
# Throttling: per-receiver levels, and the arrival loss it is judged by.
quic-bitrate = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
# Sealed datagrams, to show the relay forwards what it cannot read.
quic-e2ee = { workspace = true }
